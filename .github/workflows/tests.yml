# Unit and command tests (levels 1 and 2 in README.md). Also called by release.yml.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1
        with:
          enable-cache: true
      # uv takes Python 3.12 from .python-version and the pinned maubot from uv.lock.
      - run: uv sync --locked --group dev
      - run: uv run pytest
